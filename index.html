<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff2f7"><title>おもちゃばこ | ぽんっと反射ゲーム</title><link rel="stylesheet" href="style.css"></head>
<body><main class="shell"><header><div class="eyebrow">✦ little toy box ✦</div><h1>🧸 おもちゃばこ 🎀</h1><p>でてきたおもちゃを、ぽんっ！とタップしてね</p></header>
<section class="panel" aria-label="反射神経ゲーム"><div class="stats"><div>のこり <strong id="remaining">10</strong> こ</div><div>平均 <strong id="average">—</strong> ms</div><div>空振り <strong id="misses">0</strong> 回</div></div>
<div id="field" class="field" aria-label="ゲームエリア"><div id="message" class="message"><span class="big">🎁</span><h2>あそぶ準備はできた？</h2><p>10このおもちゃを見つけよう！</p><button id="start" type="button">あそぶ ♡</button></div><button id="target" class="target" type="button" hidden aria-label="おもちゃをタップ"></button><span id="pop" class="pop" hidden>ぽんっ！</span></div>
<div id="result" class="result" hidden><h2>🎉 おつかれさま！</h2><p id="resultText"></p><button id="retry" type="button">もういっかい ♡</button></div>
<p class="hint">おもちゃが出てからタップするまでの速さを計るよ！</p></section><footer>made with ♡ · omochabako v2.0</footer></main><script src="game.js" defer></script></body></html>
